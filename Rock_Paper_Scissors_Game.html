<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock-Paper-Scissors-Game</title>
  <link rel="stylesheet" href="Rock_Paper_Scissors_Game.css" />
</head>
<body>
  <div class="titlesec">
    <h1>Rock Paper Scissors Game</h1>
  </div>
  <div class="choicesec">
    <img id="rock" class="choice" src="rock-removebg-preview.png" alt="" />
    <img id="paper" class="choice" src="paper-removebg-preview.png" alt="" />
    <img id="scissor" class="choice" src="scissors-removebg-preview.png" alt="" />
  </div>
  <div class="scoresec">
    <div class="userscoresec">
      <p>Your Score:</p>
      <p id="userscore">0</p>
    </div>
    <div class="computerscoresec">
      <p>Computer Score:</p>
      <p id="computerscore">0</p>
    </div>
  </div>
  <div class="messagesec">
    <p class="messages">Play your move</p>
  </div>
  <div></div>
  <script src="Rock_Paper_Scissors_Game.js"></script>
</body>
</html>
